name: Build TWRP Exynos 990

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Repo and Sync
        run: |
          mkdir workspace
          cd workspace
          
          # Sử dụng AOSP Manifest cho Android 11 / 12.1
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Setup Device Tree & Build
        run: |
          cd workspace
          mkdir -p device/samsung/exynos990-common
          cp -r $GITHUB_WORKSPACE/* device/samsung/exynos990-common/
          
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_exynos990-eng || lunch omni_exynos990-eng
          mka recoveryimage -j$(nproc)
