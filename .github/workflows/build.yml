name: Build TWRP Exynos 990

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Git Configuration
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync Source & Build TWRP
        run: |
          mkdir -p ~/workspace
          cd ~/workspace

          # 1. Sync mã nguồn TWRP
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

          # 2. Copy Device Tree vào thư mục
          mkdir -p device/samsung/exynos990-common
          cp -r $GITHUB_WORKSPACE/* device/samsung/exynos990-common/

          # 3. Tự động tìm tên Product trong file omni_*.mk hoặc twrp_*.mk
          cd device/samsung/exynos990-common
          MK_FILE=$(ls omni_*.mk twrp_*.mk 2>/dev/null | head -n 1)
          
          if [ -z "$MK_FILE" ]; then
            echo "LỖI: Không tìm thấy file omni_*.mk hoặc twrp_*.mk trong mã nguồn của bạn!"
            exit 1
          fi

          # Tách lấy tên lunch target (VD: omni_c2s.mk -> omni_c2s-eng)
          TARGET=$(echo "$MK_FILE" | sed 's/\.mk//')-eng
          echo "Tìm thấy Target Build: $TARGET"

          # 4. Chạy lệnh Build
          cd ~/workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch $TARGET
          mka recoveryimage -j$(nproc)
