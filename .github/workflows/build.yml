name: Build TWRP Exynos 990

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Git Configuration
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync Source & Build TWRP
        run: |
          mkdir -p ~/workspace
          cd ~/workspace

          # 1. Sync mã nguồn TWRP
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

          # 2. Xóa sạch các folder trùng lặp trong device/samsung do roomservice tạo ra
          rm -rf device/samsung/*

          # 3. Copy Device Tree của bạn vào device/samsung/c1s
          mkdir -p device/samsung/c1s
          cp -r $GITHUB_WORKSPACE/* device/samsung/c1s/

          # 4. Tìm đúng file .mk để lunch
          cd device/samsung/c1s
          PRODUCT_MK=$(ls twrp_*.mk omni_*.mk 2>/dev/null | head -n 1)
          
          if [ -z "$PRODUCT_MK" ]; then
            echo "LỖI: Không tìm thấy file twrp_*.mk hoặc omni_*.mk!"
            exit 1
          fi

          PRODUCT_NAME=$(echo "$PRODUCT_MK" | sed 's/\.mk//')
          echo "=====> Target Build chính xác: ${PRODUCT_NAME} <====="

          # 5. Khởi chạy quá trình Build
          cd ~/workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${PRODUCT_NAME}-eng
          mka recoveryimage -j$(nproc)
          
      - name: Upload Recovery Image to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Exynos990_Recovery
          path: |
            ~/workspace/out/target/product/*/recovery.img
            ~/workspace/out/target/product/*/*.img
          if-no-files-found: error
