name: Build TWRP Exynos 990

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Git Configuration
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync Source & Build TWRP
        run: |
          mkdir -p ~/workspace
          cd ~/workspace

          # 1. Sync mã nguồn TWRP
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

          # 2. Dọn dẹp thư mục c1s cũ nếu roomservice đã tự tải về
          rm -rf device/samsung/c2s

          # 3. Copy mã nguồn của bạn vào đúng đường dẫn device/samsung/c1s
          mkdir -p device/samsung/c2s
          cp -r $GITHUB_WORKSPACE/* device/samsung/c2s/

          # 4. Khởi tạo môi trường và biên dịch cho c2s
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_c2s-eng || lunch omni_c2s-eng
          mka recoveryimage -j$(nproc)
