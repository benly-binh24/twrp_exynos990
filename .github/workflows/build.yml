name: Build TWRP Exynos 990 (c2s)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Git Configuration
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync Source & Build TWRP for c2s
        run: |
          mkdir -p ~/workspace
          cd ~/workspace

          # 1. Sync mã nguồn TWRP Android 11
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

          # 2. Xóa sạch dữ liệu cũ trong device/samsung
          rm -rf device/samsung/*

          # 3. Copy mã nguồn vào đúng đường dẫn c2s
          mkdir -p device/samsung/exynos990/c2s
          cp -r $GITHUB_WORKSPACE/* device/samsung/exynos990/c2s/

          # 4. Tự động chuyển toàn bộ c1s sang c2s & sửa AndroidProducts.mk
          cd device/samsung/exynos990/c2s
          
          # Đổi tên file cấu hình nếu còn là c1s
          if [ -f "twrp_c1s.mk" ]; then
            mv twrp_c1s.mk twrp_c2s.mk
          fi

          # Thay thế nội dung c1s -> c2s trong tất cả các file .mk
          sed -i 's/c1s/c2s/g' twrp_c2s.mk || true
          sed -i 's/exynos990\/c1s/exynos990\/c2s/g' BoardConfig.mk || true
          sed -i 's/exynos990\/c1s/exynos990\/c2s/g' device.mk || true

          # Ghi đè file AndroidProducts.mk để đảm bảo khai báo đúng sản phẩm
          cat <<EOF > AndroidProducts.mk
          PRODUCT_MAKEFILES := \$(LOCAL_DIR)/twrp_c2s.mk

          COMMON_LUNCH_CHOICES := \
              twrp_c2s-userdebug \
              twrp_c2s-eng
          EOF

          echo "=====> Nội dung AndroidProducts.mk đã cập nhật <====="

          # 5. Khởi chạy biên dịch
          cd ~/workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export ROOMSERVICE_BRANCHES="twrp-11"
          source build/envsetup.sh
          
          # Thử lunch với userdebug trước, nếu không được sẽ fallback sang eng
          lunch twrp_c2s-userdebug || lunch twrp_c2s-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Image to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_c2s_Recovery
          path: |
            ~/workspace/out/target/product/c2s/recovery.img
            ~/workspace/out/target/product/*/recovery.img
          if-no-files-found: error
